# Codex lane only: an independent project, volume and published ports.
name: nostos-codex

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nostos
      POSTGRES_PASSWORD: nostos
      POSTGRES_DB: nostos_codex
      TZ: UTC
    ports:
      - "5438:5432"
    volumes:
      - nostos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nostos -d nostos_codex"]
      interval: 2s
      timeout: 3s
      retries: 30
  # Optional: PgBouncer in *transaction* pooling mode, the same mode as Neon's pooled endpoint.
  # Used by `pnpm test:pooled` to prove the app (advisory xact locks, interactive transactions) works through it.
  pooler:
    image: edoburu/pgbouncer:v1.25.2-p0
    profiles: ["pooler"]
    depends_on: [db]
    environment:
      DB_HOST: db
      DB_USER: nostos
      DB_PASSWORD: nostos
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 10
    ports:
      - "6439:5432"

volumes:
  nostos_pg:
